name: Secret hygiene

on:
  push:
  pull_request:

jobs:
  check-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for secrets / forbidden tracked files
        run: python scripts/check_no_secrets.py
