# Place under /etc/nginx/sites-available/tracking-planes
# then: sudo ln -s /etc/nginx/sites-available/tracking-planes /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Build the React app first:
#   cd /opt/tracking-planes/web && npm ci && npm run build
# Static files are served from web/dist; API proxied to uvicorn :8000.

server {
    listen 80 default_server;
    server_name _;

    root /opt/tracking-planes/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
